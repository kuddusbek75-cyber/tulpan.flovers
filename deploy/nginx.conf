# Ограничение частоты запросов: боты не смогут завалить сайт
limit_req_zone $binary_remote_addr zone=tulpan:10m rate=10r/s;

server {
    listen 80;
    server_name ВАШ-ДОМЕН www.ВАШ-ДОМЕН;
    server_tokens off;
    client_max_body_size 6m;

    # Служебные файлы не отдаём никогда
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sqlite3|py|env|bak|sql)$ { deny all; }

    location / {
        limit_req zone=tulpan burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
