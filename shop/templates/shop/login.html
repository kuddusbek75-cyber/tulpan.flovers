<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход</title>
<link rel="icon" href="/static/shop/img/logo.jpg">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:#110d10;color:#f7eff2;font:15px/1.5 system-ui,sans-serif}
form{width:min(360px,100%);background:#1c161a;border:1px solid #2e252b;border-radius:18px;padding:28px;display:grid;gap:14px}
h1{font-size:22px;font-weight:600;text-align:center}
img{width:72px;height:72px;border-radius:50%;margin:0 auto}
label{display:grid;gap:5px;font-size:12.5px;color:#a8989f;font-weight:600}
input{width:100%;background:#171216;color:inherit;border:1px solid #3d3139;border-radius:10px;padding:10px 12px;font:inherit}
input:focus{border-color:#f2708f;outline:0}
button{height:42px;border:0;border-radius:10px;background:#f2708f;color:#2a0d16;font:600 14px system-ui,sans-serif;cursor:pointer}
.err{color:#ff7b7b;font-size:13px;text-align:center}
.trap{position:absolute;left:-9999px}
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <img src="/static/shop/img/logo.jpg" alt="">
  <h1>Вход в панель</h1>
  {% if message %}<div class="err" role="alert">{{ message }}</div>{% endif %}
  <label>Логин<input name="username" autocomplete="username" required autofocus></label>
  <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
  <label>Код из приложения<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456"></label>
  <div class="trap" aria-hidden="true"><label>Сайт<input name="website" tabindex="-1" autocomplete="off"></label></div>
  <button>Войти</button>
</form>
</body>
</html>
